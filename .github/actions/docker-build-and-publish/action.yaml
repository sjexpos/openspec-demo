name: "Docker build and publish"
description: "A reusable action to build and tag Application's Docker image"
inputs:
  context:
    type: string
    required: false
    default: ./
  dockerfile:
    type: string
    required: false
    default: ./Dockerfile
  registry_name:
    type: string
    required: false
    default: '' # Use docker.io for Docker Hub if empty
  registry_user:
    type: string
    required: true
  registry_token:
    type: string
    required: true
  image_name:
    type: string
    required: true
  image_tag:
    type: string
    required: true
  platforms:
    type: string
    required: false
    default: linux/amd64, linux/arm64

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4.2.0
    - name: Install cosign
      uses: sigstore/cosign-installer@v4.1.2
      with:
        cosign-release: 'v3.0.6'
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.2.0
    # Login against a Docker registry
    # https://github.com/docker/login-action
    - name: Log into registry ${{ inputs.registry_name }}
      uses: docker/login-action@v4.5.1
      with:
        registry: ${{ inputs.registry_name }}
        username: ${{ inputs.registry_user }}
        password: ${{ inputs.registry_token }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: ${{ inputs.image_name }}
    - name: Build and push
      uses: docker/build-push-action@v7.3.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: |
          ${{ inputs.image_name }}:${{ inputs.image_tag }}
          ${{ inputs.image_name }}:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
