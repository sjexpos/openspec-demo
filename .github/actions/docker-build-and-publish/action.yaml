name: "Docker build and publish"
description: "A reusable action to build and tag Application's Docker image"
inputs:
  context:
    type: string
    required: false
    default: ./
  dockerfile:
    type: string
    required: false
    default: ./Dockerfile
  registry_name:
    type: string
    required: false
    default: '' # Use docker.io for Docker Hub if empty
  registry_user:
    type: string
    required: true
  registry_token:
    type: string
    required: true
  image_name:
    type: string
    required: true
  platforms:
    type: string
    required: false
    default: linux/amd64, linux/arm64

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4.2.0
    - name: Install cosign
      if: github.event_name != 'pull_request'
      uses: sigstore/cosign-installer@v4.1.2
      with:
        cosign-release: 'v3.0.6'
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.2.0
    # Login against a Docker registry except on PR
    # https://github.com/docker/login-action
    - name: Log into registry ${{ inputs.registry_name }}
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4.5.1
      with:
        registry: ${{ inputs.registry_name }}
        username: ${{ inputs.registry_user }}
        password: ${{ inputs.registry_token }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: ${{ inputs.image_name }}
    - name: Resolving tag name
      shell: bash
      env:
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      run: |
        echo "SANITIZED_BRANCH_NAME=$(echo "${{ env.BRANCH_NAME }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        if [ "${{ github.ref_name }}" = "main" ]; then TAG_NAME="latest"; else TAG_NAME="$SANITIZED_BRANCH_NAME"; fi
        echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
    - name: Build and push
      uses: docker/build-push-action@v7.3.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ inputs.image_name }}:${{ env.TAG_NAME }}
          ${{ inputs.image_name }}:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
