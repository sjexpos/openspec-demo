name: "Test single docker image"
description: "A reusable action to download and test Docker image"
inputs:
  registry_name:
    type: string
    required: false
    default: '' # Use docker.io for Docker Hub if empty
  registry_user:
    type: string
    required: true
  registry_token:
    type: string
    required: true
  image:
    description: ""
    type: string
    required: true
  tag:
    description: ""
    type: string
    required: true
  platform:
    description: "Platform"
    type: string
    required: true

runs:
  using: "composite"
  steps:
    - name: Log into registry ${{ inputs.registry_name }}
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry_name }}
        username: ${{ inputs.registry_user }}
        password: ${{ inputs.registry_token }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Download image ${{ inputs.image }}:${{ inputs.tag }} ${{ inputs.platform }}
      shell: bash
      run: |
        echo "Downloading ${{ inputs.image }} in platform ${{ inputs.platform }}..."
        docker pull --platform ${{ inputs.platform }} ${{ inputs.image }}:${{ inputs.tag }}
    - name: Test image ${{ inputs.image }}:${{ inputs.tag }} ${{ inputs.platform }}
      shell: bash
      run: |
        echo "Run test in ${{ inputs.image }}..."
        docker run -d --rm --network host --platform ${{ inputs.platform }} -p 8080:8080 \
               -e JAVA_XMS=256m \
               -e JAVA_XMX=1g \
               -e PORT=8080 -e MANAGEMENT_PORT=8080 \
               -e DATABASE_HOST=localhost \
               -e DATABASE_PORT=5432 \
               -e DATABASE_SCHEMA=openspec \
               -e DATABASE_USER=admin \
               -e DATABASE_PASSWORD=secret \
              ${{ inputs.image }}:${{ inputs.tag }} uname -m
    - name: Health check
      shell: bash
      run: |
        attempts=0
        max_attempts=10
        echo "Waiting SonarQube is started"
        echo "http://localhost:8080/actuator/health"
        while [ $attempts -lt $max_attempts ]; do
          ((attempts++))
          status=$(curl -s "http://localhost:8080/actuator/health" | jq -r '.status') 
          if [ "$status" == "UP" ]; then 
            echo "El servicio está UP." 
            break 
          fi 
          echo "Waiting... (tries $attempts/$max_attempts)"
          sleep 5 
        done
        if [ "$status" != "UP" ]; then
          echo "Timeout: service is not responding."
          exit 1
        fi
