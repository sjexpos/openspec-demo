name: "Test single docker image"
description: "A reusable action to download and test Docker image"
inputs:
  registry_name:
    type: string
    required: false
    default: '' # Use docker.io for Docker Hub if empty
  registry_user:
    type: string
    required: true
  registry_token:
    type: string
    required: true
  image:
    description: ""
    type: string
    required: true
  tag:
    description: ""
    type: string
    required: true
  platform:
    description: "Platform"
    type: string
    required: true

runs:
  using: "composite"
  steps:
    - name: Log into registry ${{ inputs.registry_name }}
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry_name }}
        username: ${{ inputs.registry_user }}
        password: ${{ inputs.registry_token }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Download image ${{ inputs.image }}:${{ inputs.tag }} ${{ inputs.platform }}
      shell: bash
      run: |
        echo "Downloading ${{ inputs.image }} in platform ${{ inputs.platform }}..."
        docker pull --platform ${{ inputs.platform }} ${{ inputs.image }}:${{ inputs.tag }}
    - name: Test image ${{ inputs.image }}:${{ inputs.tag }} ${{ inputs.platform }}
      shell: bash
      run: |
        echo "Run test in ${{ inputs.image }}..."
        docker run -d --rm --name tested-service --network host --platform ${{ inputs.platform }} \
               -e JAVA_XMS=256m \
               -e JAVA_XMX=1g \
               -e PORT=8080 -e MANAGEMENT_PORT=8080 \
               -e DATABASE_HOST=localhost \
               -e DATABASE_PORT=5432 \
               -e DATABASE_SCHEMA=openspec \
               -e DATABASE_USER=admin \
               -e DATABASE_PASSWORD=secret \
              ${{ inputs.image }}:${{ inputs.tag }}
        echo "Waiting for service localhost:8080..."
        .github/actions/test-docker-image/wait-for-it.sh -h localhost -p 8080 -t 300 -- echo "Service is running!"
        sleep 5s
    - name: Health check
      shell: bash
      run: |
        status=$(curl -s "http://localhost:8080/actuator/health" | jq -r '.status') 
        if [ "$status" == "UP" ]; then 
          echo "Service is up and running." 
          exit 0
        fi
        echo "Health check failed"
        exit 1
    - name: Check hash commit build
      shell: bash
      env:
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        img_commit_build=$(curl -s "http://localhost:8080/actuator/info" | jq -r '.git.commit.id.full') 
        if [ "$img_commit_build" == "$COMMIT_SHA" ]; then 
          echo "Image commit hash build is correct" 
          exit 0
        fi
        echo "Image has a different commit bash than this PR / merge"
        exit 1
    - name: Show logs if failure
      if: failure()
      shell: bash
      run: |
        echo "----------------------------------------------------------"
        echo "::error:: Show container logs"
        echo "----------------------------------------------------------"
        docker logs tested-service
