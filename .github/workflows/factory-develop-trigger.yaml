name: Factory - Develop Jira Ticket
run-name: "Factory - Develop Jira Ticket ${{ inputs.jira_ticket }}"
on:
  workflow_dispatch:
    inputs:
      jira_ticket:
        description: "Jira ticket key (e.g. PROJ-123)"
        required: true
        type: string
permissions:
  contents: read

env:
  OPENCODE_VERSION: 1.19.6
  OPENSPEC_VERSION: 1.10.0
  SDD_AGENT: orchestrator
  PR_AGENT: orchestrator

jobs:

  run-sdd-agent:
    name: Run SDD agent on Jira ticket
    runs-on: ubuntu-24.04
    timeout-minutes: 360 # 6hs - max github timeout in no self-hosted
    services:
      postgres:
        image: postgres:14.4
        ports:
          - 5432:5432
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:4.3.0
        ports:
          - 4566:4566
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DEBUG: 0
          S3_SKIP_SIGNATURE_VALIDATION: 0
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Override ssh submodules to https with PAT (Personal Access Token)
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@v7.0.1
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_PAT }}
      - name: Resolve develop prompt
        id: resolve-develop-prompt
        uses: ./.github/actions/resolve-jira-ticket
        with:
          jira-ticket: ${{ inputs.jira_ticket }}
          prompt-template: ".github/workflows/prompts/factory-develop.md"
      - name: Resolve pull request prompt
        id: resolve-pr-prompt
        uses: ./.github/actions/resolve-jira-ticket
        with:
          jira-ticket: ${{ steps.resolve-develop-prompt.outputs.jira-ticket }}
          prompt-template: ".github/workflows/prompts/factory-pr.md"
          prompt-file: ${{ runner.temp }}/jira-ticket-prompts/Prompt-pr.txt
      - name: Export jira ticket environment
        env:
          JIRA_TICKET_VALUE: ${{ steps.resolve-develop-prompt.outputs.jira-ticket }}
          PROMPT_FILE_VALUE: ${{ steps.resolve-develop-prompt.outputs.prompt-file }}
          PR_PROMPT_FILE_VALUE: ${{ steps.resolve-pr-prompt.outputs.prompt-file }}
        run: |
          echo "JIRA_TICKET=$JIRA_TICKET_VALUE" >> $GITHUB_ENV
          {
            echo "PROMPT_CONTENT<<PROMPT_CONTENT_EOF"
            cat "$PROMPT_FILE_VALUE"
            echo "PROMPT_CONTENT_EOF"
          } >> $GITHUB_ENV
          {
            echo "PR_PROMPT_CONTENT<<PR_PROMPT_CONTENT_EOF"
            cat "$PR_PROMPT_FILE_VALUE"
            echo "PR_PROMPT_CONTENT_EOF"
          } >> $GITHUB_ENV
          rm -f "$PROMPT_FILE_VALUE" "$PR_PROMPT_FILE_VALUE"
          echo "Resolved agent: $SDD_AGENT"
          echo "Resolved jira ticket: $JIRA_TICKET_VALUE"
      - name: Install uvx
        uses: astral-sh/setup-uv@v10.3.0
      - name: Install OpenCode ${{ env.OPENCODE_VERSION }}
        run: |
          mkdir -p "$HOME/tmp"
          cd "$HOME/tmp" && wget https://opencode.ai/install
          chmod 755 $HOME/tmp/install
          $HOME/tmp/install -v $OPENCODE_VERSION
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH
      - name: Install global OpenCode config
        run: |
          mkdir -p "$HOME/.config/opencode"
          cp "$GITHUB_WORKSPACE/.github/workflows/prompts/opencode.json" "$HOME/.config/opencode/opencode.jsonc"
          cat "$HOME/.config/opencode/opencode.jsonc"
      - name: Install OpenSpec ${{ env.OPENSPEC_VERSION }}
        run: |
          npm install -g @fission-ai/openspec@$OPENSPEC_VERSION
      - name: Install PostgreSQL client (psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Run OpenCode with SDD orchestrator agent
        env:
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENCODEGO_API_KEY: ${{ secrets.OPENCODEGO_API_KEY }}
        run: |
          opencode run --agent "$SDD_AGENT" "$PROMPT_CONTENT"
      - name: List all local changes
        run: |
          git status
      - name: Run OpenCode to create pull request
        env:
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENCODEGO_API_KEY: ${{ secrets.OPENCODEGO_API_KEY }}
        run: |
          opencode run --agent "$PR_AGENT" "$PR_PROMPT_CONTENT"
