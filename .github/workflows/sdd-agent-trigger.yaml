name: SDD Agent 

on:
  issues:
    types: [labeled]

permissions:
  issues: write

env:
  ENRICH_AGENT: product-strategy-analyst
  SDD_AGENT: orchestrator

jobs:
  run-enrich-agent:
    name: Run enrich agent on issue
    if: ${{ github.event.label.name == 'sdd-enrich' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # 1hs
    steps:
      - name: Override ssh submodules to https with PAT (Personal Access Token)
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@v7.0.1
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_PAT }}
      - name: Parse issue form inputs
        id: parse-issue-form
        uses: ./.github/actions/parse-issue-form
        with:
          issue-body: ${{ github.event.issue.body }}
          fields: Jira Ticket,Model,Behavior
      - name: Resolve jira ticket, model and behavior
        env:
          PARSED_VALUES: ${{ steps.parse-issue-form.outputs.values }}
          FILES_DIR: ${{ steps.parse-issue-form.outputs.files-dir }}
        run: |
          jira_ticket=$(jq -r '."Jira Ticket" // empty' <<< "$PARSED_VALUES")
          model=$(jq -r '.Model // empty' <<< "$PARSED_VALUES")
          behavior=$(jq -r '.Behavior // empty' <<< "$PARSED_VALUES")
          if [ -z "$jira_ticket" ] || [ -z "$model" ]; then
            echo "::error::Both Jira Ticket and Model are required." >&2
            exit 1
          fi
          if [ -z "$behavior" ]; then
            echo "::error::Behavior is required." >&2
            exit 1
          fi
          echo "Resolved behavior: $behavior"
          prompt_file="$FILES_DIR/Prompt.txt"
          sed "s/{{JIRA_TICKET}}/$jira_ticket/g" ".github/workflows/prompts/sdd-agent-trigger-enrich.md" > "$prompt_file"
          echo "Resolved agent: $ENRICH_AGENT"
          echo "Resolved jira ticket: $jira_ticket"
          echo "Resolved model: $model"
          echo "MODEL=$model" >> $GITHUB_ENV
          echo "JIRA_TICKET=$jira_ticket" >> $GITHUB_ENV
          echo "BEHAVIOR=$behavior" >> $GITHUB_ENV
          echo "PROMPT_FILE=$prompt_file" >> $GITHUB_ENV
      - name: Install uvx
        uses: astral-sh/setup-uv@v10.3.0
      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH
      - name: Run OpenCode agent
        env:
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          opencode run --agent "$ENRICH_AGENT" --model "$MODEL" "$(cat "$PROMPT_FILE")"
      - name: List tmp directory contents
        if: ${{ hashFiles('tmp/**') != '' }}
        run: |
          ls -laR tmp
      - name: Comment on issue
        uses: actions/github-script@v9.0.0
        env:
          JIRA_TICKET: ${{ env.JIRA_TICKET }}
        with:
          script: |
            const fs = require('fs');
            const enrichedFile = `tmp/${process.env.JIRA_TICKET}-enriched-us.md`;
            const content = fs.existsSync(enrichedFile)
              ? fs.readFileSync(enrichedFile, 'utf8').trim()
              : '';
            if (content.length === 0) {
              core.setFailed(`Enriched user story file not found or empty: ${enrichedFile}`);
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: content
            });
      - name: Generate GitHub App token
        if: ${{ env.BEHAVIOR == 'full-auto' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SDD_APP_ID }}
          private-key: ${{ secrets.SDD_APP_PRIVATE_KEY }}
      - name: Trigger implementation on full-auto behavior
        if: ${{ env.BEHAVIOR == 'full-auto' }}
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issue_number = context.issue.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ['sdd-implement']
            });

  run-sdd-agent:
    name: Run SDD agent on issue
    if: ${{ github.event.label.name == 'sdd-implement' }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:14.4
        ports:
          - 5432:5432
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:4.3.0
        ports:
          - 4566:4566
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DEBUG: 0
          S3_SKIP_SIGNATURE_VALIDATION: 0
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 480 # 8hs
    steps:
      - name: Override ssh submodules to https with PAT (Personal Access Token)
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@v7.0.1
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_PAT }}
      - name: Parse issue form inputs
        id: parse-issue-form
        uses: ./.github/actions/parse-issue-form
        with:
          issue-body: ${{ github.event.issue.body }}
          fields: Jira Ticket,Model,Behavior
      - name: Resolve jira ticket, model and behavior
        env:
          PARSED_VALUES: ${{ steps.parse-issue-form.outputs.values }}
          FILES_DIR: ${{ steps.parse-issue-form.outputs.files-dir }}
        run: |
          jira_ticket=$(jq -r '."Jira Ticket" // empty' <<< "$PARSED_VALUES")
          model=$(jq -r '.Model // empty' <<< "$PARSED_VALUES")
          behavior=$(jq -r '.Behavior // empty' <<< "$PARSED_VALUES")
          if [ -z "$jira_ticket" ] || [ -z "$model" ]; then
            echo "::error::Both Jira Ticket and Model are required." >&2
            exit 1
          fi
          if [ -z "$behavior" ]; then
            echo "::error::Behavior is required." >&2
            exit 1
          fi
          echo "Resolved behavior: $behavior"
          prompt_file="$FILES_DIR/Prompt.txt"
          sed "s/{{JIRA_TICKET}}/$jira_ticket/g" ".github/workflows/prompts/sdd-agent-trigger-implement.md" > "$prompt_file"
          pr_prompt_file="$FILES_DIR/Prompt-pr.txt"
          sed "s/{{JIRA_TICKET}}/$jira_ticket/g" ".github/workflows/prompts/sdd-agent-trigger-pr.md" > "$pr_prompt_file"
          echo "Resolved agent: $SDD_AGENT"
          echo "Resolved jira ticket: $jira_ticket"
          echo "Resolved model: $model"
          echo "MODEL=$model" >> $GITHUB_ENV
          echo "JIRA_TICKET=$jira_ticket" >> $GITHUB_ENV
          echo "BEHAVIOR=$behavior" >> $GITHUB_ENV
          echo "PROMPT_FILE=$prompt_file" >> $GITHUB_ENV
          echo "PR_PROMPT_FILE=$pr_prompt_file" >> $GITHUB_ENV
      - name: Install uvx
        uses: astral-sh/setup-uv@v10.3.0
      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH
      - name: Install PostgreSQL client (psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Provision LocalStack resources
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: |
          echo "Waiting for LocalStack to be ready"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_localstack/health > /dev/null; then
              echo "LocalStack is ready."
              break
            fi
            echo "Waiting..."
            sleep 2
          done
          aws cloudformation deploy \
            --template-file ./compose/localstack-resources.yml \
            --stack-name testing-stack \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides Environment=testing \
            --endpoint-url http://localhost:4566 \
            --region us-east-1

      - name: Ejecutar psql
        run: |
          psql -v ON_ERROR_STOP=1 --host localhost --username "postgres" --dbname "postgres" -f ./compose/postgres-resources.sql
        env:
          PGPASSWORD: postgres
      - name: Provision 'demo' database
        run: |
          mvn flyway:migrate
          mvn flyway:info
      - name: Run OpenCode with SDD orchestrator agent
        env:
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          opencode run --agent "$SDD_AGENT" --model "$MODEL" "$(cat "$PROMPT_FILE")"
      - name: List tmp directory contents
        if: ${{ hashFiles('tmp/**') != '' }}
        run: |
          git status
      - name: Run OpenCode to create pull request
        env:
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          opencode run --agent "$SDD_AGENT" --model "$MODEL" "$(cat "$PR_PROMPT_FILE")"
      - name: Close issue
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
