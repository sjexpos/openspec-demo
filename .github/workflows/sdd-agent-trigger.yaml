name: SDD Agent

on:
  issues:
    types: [labeled]

permissions:
  issues: write

env:
  AGENT: product-strategy-analyst

jobs:
  run-opencode:
    name: Run OpenCode agent on issue
    if: ${{ github.event.label.name == 'bot' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Parse issue form inputs
        id: parse-issue-form
        uses: ./.github/actions/parse-issue-form
        with:
          issue-body: ${{ github.event.issue.body }}
          fields: Jira Ticket,Model
      - name: Resolve jira ticket, model and prompt
        env:
          PARSED_VALUES: ${{ steps.parse-issue-form.outputs.values }}
          FILES_DIR: ${{ steps.parse-issue-form.outputs.files-dir }}
        run: |
          jira_ticket=$(jq -r '."Jira Ticket" // empty' <<< "$PARSED_VALUES")
          model=$(jq -r '.Model // empty' <<< "$PARSED_VALUES")
          if [ -z "$jira_ticket" ] || [ -z "$model" ]; then
            echo "::error::Both Jira Ticket and Model are required." >&2
            exit 1
          fi
          prompt_file="$FILES_DIR/Prompt.txt"
          printf 'Enriquecer el ticket de Jira %s\n' "$jira_ticket" > "$prompt_file"
          echo "Resolved agent: $AGENT"
          echo "Resolved jira ticket: $jira_ticket"
          echo "Resolved model: $model"
          echo "MODEL=$model" >> $GITHUB_ENV
          echo "PROMPT_FILE=$prompt_file" >> $GITHUB_ENV
      - name: Install uvx
        uses: astral-sh/setup-uv@v10.3.0
      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH
      - name: Run OpenCode agent
        env:
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          opencode run --agent "$AGENT" --model "$MODEL" "$(cat "$PROMPT_FILE")" > opencode-output.txt 2>&1
      - name: Comment on issue
        uses: actions/github-script@v9.0.0
        env:
          AGENT: ${{ env.AGENT }}
          MODEL: ${{ env.MODEL }}
          PROMPT_FILE: ${{ env.PROMPT_FILE }}
        with:
          script: |
            const fs = require('fs');
            const readSafe = (file, fallback) => {
              try {
                const content = fs.readFileSync(file, 'utf8').trim();
                return content.length > 0 ? content : fallback;
              } catch (e) {
                return fallback;
              }
            };
            const output = readSafe('opencode-output.txt', 'OpenCode agent produced no output.');
            const prompt = readSafe(process.env.PROMPT_FILE, '');
            const agent = process.env.AGENT;
            const model = process.env.MODEL;
            const body = [
              `OpenCode agent \`${agent}\` (model: \`${model}\`) was executed with prompt: "${prompt}"`,
              '',
              '```',
              output,
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
      - name: List tmp directory contents
        if: ${{ hashFiles('tmp/**') != '' }}
        run: |
          ls -laR tmp
