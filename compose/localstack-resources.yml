AWSTemplateFormatVersion: 2010-09-09
Description:  Develop - Buckets provisioning
Parameters:
  Environment:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: 'develop'

Resources: 

  AssetsEventsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        !Join [ 
          '-', 
          [ 
            !Ref Environment,
            'assets-events-dlq'
          ],
        ]

      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600 # 14 days in seconds, poison-message parking lot

  AssetsEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        !Join [ 
          '-', 
          [ 
            !Ref Environment,
            'assets-events-queue'
          ],
        ]

      VisibilityTimeout: 300
      MessageRetentionPeriod: 3600 # this value is in seconds, so this is 1 hour
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AssetsEventsDeadLetterQueue.Arn
        maxReceiveCount: 5

  AssetsS3Bucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - AssetsEventsQueue
    Properties:
      BucketName:
        !Join [ 
          '-', 
          [ 
            !Ref Environment,
            'assets'
          ],
        ]
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt AssetsEventsQueue.Arn
      AccessControl: PublicRead
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - content-type
            AllowedMethods:
              - PUT
            AllowedOrigins:
              # '*' is acceptable locally only; production must list explicit app origins.
              - '*'
            ExposedHeaders:
              - Date
            Id: brandImagesBrowserUploads
            MaxAge: 3000
#      PublicAccessBlockConfiguration:
#        BlockPublicAcls : false
#        BlockPublicPolicy : false
#        IgnorePublicAcls : false
#        RestrictPublicBuckets : false

  AssetsS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn:
      - AssetsS3Bucket
    Properties:
      Bucket: !Ref AssetsS3Bucket
      PolicyDocument:
        Id: AssetsS3BucketPolicyId
        Version: 2012-10-17
        Statement:
          - Sid: PublicReadGetObjects
            Effect: Allow
            Principal:
              AWS: '*'
            Action: 's3:GetObject'
            Resource: !Join ['', ['arn:aws:s3:::', !Ref AssetsS3Bucket, /*]]

  SQSQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    DependsOn:
      - AssetsS3Bucket
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: "*"
            Action: SQS:SendMessage
            Resource: "*"
            Condition:
              ArnLike:
                aws:SourceArn: !GetAtt AssetsS3Bucket.Arn
      Queues:
        - Ref: AssetsEventsQueue

Outputs:
  AssetsBucketURL:
    Value: !GetAtt AssetsS3Bucket.WebsiteURL
    Export:
      Name:
        !Join [ 
          '-', 
          [ 
          !Ref Environment,
          'assets-bucket-url'
          ],
        ]
  AssetsBucketName:
    Value: !Ref AssetsS3Bucket
    Export:
      Name:
        !Join [ 
          '-', 
          [ 
          !Ref Environment,
          'assets-bucket-name'
          ],
        ]

  AssetsEventsQueueArn:
    Description: SQS ARN of the assets events queue
    Value: !GetAtt AssetsEventsQueue.Arn
    Export:
      Name:
        !Join [ 
          '-', 
          [ 
          !Ref Environment,
          'assets-events-queue-arn'
          ],
        ]

  AssetsEventsQueueUrl:
    Description: SQS URL of the assets events queue
    Value: !Ref AssetsEventsQueue
    Export:
      Name:
        !Join [ 
          '-', 
          [ 
          !Ref Environment,
          'assets-events-queue-url'
          ],
        ]
