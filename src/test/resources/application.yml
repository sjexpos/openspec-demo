spring:
  # Datasource configuration (PostgreSQL via environment variables)
  cloud:
    aws:
      region:
        static: us-east-1
      endpoint: http://localhost:4566
      s3:
        path-style-access-enabled: true
      sqs:
        observation-enabled: true
        listener:
          max-concurrent-messages: 2
          max-messages-per-poll: 2
          poll-timeout: PT5S
          max-delay-between-polls: PT2S
          auto-startup: false # container created but not started; tests start it manually
  datasource:
    url: jdbc:postgresql://localhost:5432/tests
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/tests
    user: test
    password: test
    driver-class-name: org.postgresql.Driver
    table: flyway_schema_history
    locations:
    - classpath:flyway/release*
    fail-on-missing-locations: true
    sql-migration-prefix: V
    repeatable-sql-migration-prefix: R
    sql-migration-separator: __
    sql-migration-suffixes:
    - .sql
    encoding: UTF-8
    validate-on-migrate: true
    placeholder-replacement: true
management:
  endpoints:
    web:
      exposure:
        include: "health,info,scheduledtasks,metrics"
        exclude: auditevents, beans, conditions, configprops, env, flyway, loggers, threaddump, sbom, mappings, logfile, sessions, shutdown
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always
  info:
    git:
      mode: full
#logging:
#  level:
#    org.hibernate.orm.jdbc.bind: trace
#    org.hibernate.SQL: debug

aws:
  s3:
    bucket: develop-assets
    presign-ttl: PT15M
  sqs:
    assets-events-queue: develop-assets-events-queue
    acknowledgement-interval: PT1S # faster batching in tests (overrides the 3 s default)
    acknowledgement-threshold: 2
    api-call-timeout: PT1.5S